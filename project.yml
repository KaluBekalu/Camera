name: Camera
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Camera:
    type: application
    platform: macOS
    sources:
      - path: Sources
    resources:
      - path: Resources/AppIcon.icns
    settings:
      base:
        PRODUCT_NAME: Camera
        PRODUCT_BUNDLE_IDENTIFIER: com.local.camera
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Build & run locally without a paid team ("Sign to Run Locally").
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets: []
